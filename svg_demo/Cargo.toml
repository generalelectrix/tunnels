[package]
name = "svg_demo"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "svg_demo"
path = "src/main.rs"

[features]
# The interactive windows. Off by default so the tessellation and headless
# rasterization paths can be checked without building SDL2 from source.
default = ["windows"]
windows = ["dep:piston_window", "dep:opengl_graphics", "dep:sdl2_window", "dep:sdl2", "dep:eframe"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json = "1"

lyon_tessellation = "1"
lyon_path = "1"
usvg = "0.48"

# Pure Rust, no C toolchain: needed by every path including headless.
graphics = { package = "piston2d-graphics", version = "0.45" }
image = "0.25"

# Render window: the same stack as tunnelclient, so output is comparable.
piston_window = { version = "0.132", optional = true }
opengl_graphics = { package = "piston2d-opengl_graphics", version = "0.89", optional = true }
sdl2_window = { package = "pistoncore-sdl2_window", version = "0.71", optional = true }
sdl2 = { version = "0.37", features = ["bundled", "static-link"], optional = true }

# Control window.
eframe = { version = "0.33", optional = true }
