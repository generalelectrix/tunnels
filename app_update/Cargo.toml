[package]
name = "app_update"
version = "0.1.0"
edition.workspace = true

[dependencies]
# The updater supplies its own release source, so no forge backend is needed. Its `ureq` agent
# also makes the release check.
self_update = { version = "1.3", default-features = false, features = [
    "ureq",
    "native-tls",
    "archive-tar",
    "compression-tar-gz",
    "checksums",
] }
serde = { workspace = true }
thiserror = "2"

[dev-dependencies]
flate2 = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
tiny_http = "0.12"
semver = "1"
