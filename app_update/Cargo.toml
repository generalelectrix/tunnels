[package]
name = "app_update"
version = "0.1.0"
edition.workspace = true

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
# The updater supplies its own release source and HTTP client, so no forge backend is needed.
# `ureq` is enabled only because the crate requires a built-in client, and that client does not
# compile without a TLS feature; `native-tls` is the one already in the tree via reqwest.
self_update = { version = "1.3", default-features = false, features = [
    "ureq",
    "native-tls",
    "archive-tar",
    "compression-tar-gz",
    "checksums",
] }
serde = { workspace = true }
thiserror = "2"

[dev-dependencies]
flate2 = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
tiny_http = "0.12"
semver = "1"
