name: Rust

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check formatting
        run: cargo fmt -- --check

  clippy:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Build and test
        run: |
          cargo build --workspace
          cargo test --workspace

  vectorization:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v5
      # A pass holds until the code or the compiler changes, so the compiler is
      # part of the key: a new one is the likeliest thing to lose vectorisation.
      - name: Identify the compiler
        id: compiler
        run: echo "hash=$(rustc -vV | shasum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Look for an earlier pass on these inputs
        id: earlier_pass
        uses: actions/cache/restore@v6
        with:
          path: .vectorization-passed
          key: vectorization-${{ matrix.os }}-${{ steps.compiler.outputs.hash }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml', 'scripts/check-vectorized.py', 'golden_image/**', 'tunnels_lib/**', 'tunnels_model/**', 'tunnels_shapes/**', 'tunnels_sprites/**') }}
      - name: Report the earlier pass
        if: steps.earlier_pass.outputs.cache-hit == 'true'
        run: echo "Nothing this job depends on has changed since $(cat .vectorization-passed) passed."
      - uses: Swatinem/rust-cache@v2
        if: steps.earlier_pass.outputs.cache-hit != 'true'
      - name: Test optimised, where the batch loops are vectorised
        if: steps.earlier_pass.outputs.cache-hit != 'true'
        run: cargo test --release -p tunnels_model
      - name: Check that batch animation evaluation vectorises
        if: steps.earlier_pass.outputs.cache-hit != 'true'
        run: python3 scripts/check-vectorized.py
      - name: Record the pass
        if: steps.earlier_pass.outputs.cache-hit != 'true'
        run: echo "$GITHUB_SHA" > .vectorization-passed
      - uses: actions/cache/save@v6
        if: steps.earlier_pass.outputs.cache-hit != 'true'
        with:
          path: .vectorization-passed
          key: ${{ steps.earlier_pass.outputs.cache-primary-key }}
